name: Linux packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install native build tools
        run: bash packaging/linux/install-build-deps.sh

      - name: Create unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        run: |
          runuser -u builder -- env HOME=/home/builder bash <<'BUILD'
            set -eu
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup show active-toolchain
            cargo xtask package --format arch
          BUILD

      - name: Publish Arch package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Custom Arch Build
          prerelease: true
          make_latest: "false"
          files: "dist/*.pkg.tar.zst"
