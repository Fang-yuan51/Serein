name: Linux packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install native build tools
        run: bash packaging/linux/install-build-deps.sh

      - name: Create unprivileged builder
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Build Arch package
        run: su builder -c "bash packaging/linux/build-package.sh arch"

      - name: Publish Arch package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Custom Arch Build
          prerelease: true
          make_latest: "false"
          files: "**/*.pkg.tar.zst"
